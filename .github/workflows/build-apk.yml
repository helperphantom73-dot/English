name: Build NexusLingo APK with Embedded Audio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Assets Folder & Download Embedded Speech Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/en_model.onnx https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-lessac-low.onnx || true
          touch assets/models/.keep

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Fat APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLingo-Standalone-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
