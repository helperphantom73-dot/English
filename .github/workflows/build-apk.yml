name: Build NexusLingo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # حذف پوشه ناقص قبلی و تولید خودکار تمام فایل‌های سیستمی و گریدل اندروید توسط فلاتر
      - name: Auto-Generate 100% Clean Android Engine
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.nexuslingo

      # تزریق خودکار مجوزهای صدا و میکروفون به مانیفست اندروید
      - name: Configure Audio Permissions
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>
              <queries>
                  <intent><action android:name=\"android.intent.action.TTS_SERVICE\" /></intent>
              </queries>
          '''
          c = c.replace('<application', perms + '\n    <application')
          with open(p, 'w') as f: f.write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLingo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
