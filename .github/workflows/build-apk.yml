name: Build NexusLingo APK (All-in-One Auto Builder)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ساخت خودکار تمام فایل‌های دارت، رابط کاربری نئون و هوش مصنوعی با یک اسکریپت
      - name: Auto-Inject All Code & Files
        run: |
          python3 - << 'EOF'
          import os

          files = {
              "pubspec.yaml": """name: nexus_lingo
          description: "Futuristic Standalone AI Language Engine"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_animate: ^4.5.0
            flutter_tts: ^4.2.0
            google_fonts: ^6.2.1

          flutter:
            uses-material-design: true
          """,

              "lib/main.dart": """import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'ui/screens/onboarding_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const NexusLingoApp());
          }

          class NexusLingoApp extends StatelessWidget {
            const NexusLingoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'NexusLingo Autonomous',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF070913),
                ),
                home: const OnboardingScreen(),
              );
            }
          }
          """,

              "lib/services/self_contained_audio.dart": """import 'package:flutter_tts/flutter_tts.dart';

          class SelfContainedAudio {
            static final FlutterTts _tts = FlutterTts();
            static bool _isInitialized = false;

            static Future<void> init() async {
              if (_isInitialized) return;
              try {
                await _tts.setLanguage("en-US");
                await _tts.setSpeechRate(0.48);
                await _tts.setPitch(1.0);
              } catch (_) {}
              _isInitialized = true;
            }

            static Future<void> speak(String text) async {
              if (!_isInitialized) await init();
              try {
                await _tts.stop();
                await _tts.speak(text);
              } catch (_) {}
            }
          }
          """,

              "lib/services/ai_linguistic_engine.dart": """import 'dart:math';

          class GeneratedLesson {
            final String domain;
            final String targetTerm;
            final String termDefinition;
            final String sentenceEn;
            final String sentenceFa;
            final String grammarFocus;
            final String quizQuestion;
            final List<String> quizOptions;
            final int correctOptionIndex;

            GeneratedLesson({
              required this.domain,
              required this.targetTerm,
              required this.termDefinition,
              required this.sentenceEn,
              required this.sentenceFa,
              required this.grammarFocus,
              required this.quizQuestion,
              required this.quizOptions,
              required this.correctOptionIndex,
            });
          }

          class AiLinguisticEngine {
            static final Random _random = Random();

            static final Map<String, List<Map<String, dynamic>>> domainKnowledge = {
              'Minecraft & Gaming': [
                {
                  'term': 'Crafting Table',
                  'trans': 'میز ساخت و ساز',
                  'subjects': ['Players', 'Builders', 'Survivors'],
                  'verbs': [{'v': 'craft', 'fa': 'می‌سازند'}],
                  'actions': [{'en': 'diamond armor to survive the Nether', 'fa': 'زره الماسی را برای بقا در ندر'}],
                  'distractors': ['Furnace', 'Brewing Stand', 'Enchanting Table']
                },
                {
                  'term': 'Redstone Repeater',
                  'trans': 'تکرارکننده و رله ردستون',
                  'subjects': ['Engineers', 'Contraption designers'],
                  'verbs': [{'v': 'install', 'fa': 'نصب می‌کنند'}],
                  'actions': [{'en': 'to delay signals and extend current range', 'fa': 'سیگنال‌ها را برای ایجاد تاخیر'}],
                  'distractors': ['Observer', 'Piston', 'Dispenser']
                }
              ],
              'Computer Science & AI': [
                {
                  'term': 'Neural Network',
                  'trans': 'شبکه عصبی مصنوعی',
                  'subjects': ['AI researchers', 'Data scientists'],
                  'verbs': [{'v': 'optimize', 'fa': 'بهینه‌سازی می‌کنند'}],
                  'actions': [{'en': 'to detect intricate visual patterns', 'fa': 'الگوهای پیچیده بصری را'}],
                  'distractors': ['Binary Tree', 'Relational Table', 'Memory Heap']
                }
              ],
              'Electrical Engineering': [
                {
                  'term': 'Oscilloscope',
                  'trans': 'اسیلوسکوپ / نوسان‌نما',
                  'subjects': ['Hardware engineers', 'Technicians'],
                  'verbs': [{'v': 'probe', 'fa': 'اندازه‌گیری می‌کنند'}],
                  'actions': [{'en': 'transient voltage spikes on circuit pins', 'fa': 'جهش‌های گذرا ولتاژ را روی پایه‌های مدار'}],
                  'distractors': ['Multimeter', 'Soldering Iron', 'Transformer']
                }
              ],
              'Culinary Arts': [
                {
                  'term': 'Sous-Vide',
                  'trans': 'پخت تحت خلاء (سو-وید)',
                  'subjects': ['Michelin chefs', 'Culinary masters'],
                  'verbs': [{'v': 'prefer', 'fa': 'ترجیح می‌دهند'}],
                  'actions': [{'en': 'to lock in juicy flavors at uniform heat', 'fa': 'طعم‌های آبدار را در حرارت یکنواخت'}],
                  'distractors': ['Deep Frying', 'Flash Boiling', 'Dry Smoking']
                }
              ]
            };

            static GeneratedLesson generateDynamicLesson(String domain, String level, int age) {
              final domainKey = domainKnowledge.containsKey(domain) ? domain : 'Minecraft & Gaming';
              final items = domainKnowledge[domainKey]!;
              final item = items[_random.nextInt(items.length)];

              final sub = (item['subjects'] as List<String>)[0];
              final verb = (item['verbs'] as List<Map<String, String>>)[0];
              final action = (item['actions'] as List<Map<String, String>>)[0];

              final sentenceEn = "$sub ${verb['v']} the ${item['term']} ${action['en']}.";
              final sentenceFa = "$sub ${action['fa']} با «${item['trans']}» ${verb['fa']}.";

              final options = List<String>.from(item['distractors'] as List<String>);
              options.add(item['term'] as String);
              options.shuffle(_random);

              return GeneratedLesson(
                domain: domainKey,
                targetTerm: item['term'] as String,
                termDefinition: item['trans'] as String,
                sentenceEn: sentenceEn,
                sentenceFa: sentenceFa,
                grammarFocus: "Present Simple Structure",
                quizQuestion: "What is utilized: \\"... ${action['en']}\\"?",
                quizOptions: options,
                correctOptionIndex: options.indexOf(item['term'] as String),
              );
            }

            static List<String> getAllDomains() => domainKnowledge.keys.toList();
          }
          """,

              "lib/ui/widgets/glass_card.dart": """import 'dart:ui';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          class GlassCard extends StatefulWidget {
            final Widget child;
            final double blur;
            final double opacity;
            final Color neonBorderColor;
            final EdgeInsetsGeometry? padding;
            final VoidCallback? onTap;

            const GlassCard({
              super.key,
              required this.child,
              this.blur = 20.0,
              this.opacity = 0.12,
              this.neonBorderColor = const Color(0xFF00FFCC),
              this.padding,
              this.onTap,
            });

            @override
            State<GlassCard> createState() => _GlassCardState();
          }

          class _GlassCardState extends State<GlassCard> {
            double _scale = 1.0;

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                onTapDown: widget.onTap != null
                    ? (_) {
                        HapticFeedback.selectionClick();
                        setState(() => _scale = 0.96);
                      }
                    : null,
                onTapUp: widget.onTap != null
                    ? (_) {
                        setState(() => _scale = 1.0);
                        widget.onTap!();
                      }
                    : null,
                onTapCancel: widget.onTap != null ? () => setState(() => _scale = 1.0) : null,
                child: AnimatedScale(
                  scale: _scale,
                  duration: const Duration(milliseconds: 120),
                  curve: Curves.easeOutQuad,
                  child: ClipRRect(
                    borderRadius: BorderRadius.circular(26.0),
                    child: BackdropFilter(
                      filter: ImageFilter.blur(sigmaX: widget.blur, sigmaY: widget.blur),
                      child: Container(
                        padding: widget.padding ?? const EdgeInsets.all(18.0),
                        decoration: BoxDecoration(
                          color: Colors.white.withOpacity(widget.opacity),
                          borderRadius: BorderRadius.circular(26.0),
                          border: Border.all(
                            color: widget.neonBorderColor.withOpacity(0.4),
                            width: 1.5,
                          ),
                          boxShadow: [
                            BoxShadow(
                              color: widget.neonBorderColor.withOpacity(0.18),
                              blurRadius: 18,
                              spreadRadius: 2,
                            ),
                          ],
                        ),
                        child: widget.child,
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          """,

              "lib/ui/widgets/neon_background.dart": """import 'package:flutter/material.dart';
          import 'package:flutter_animate/flutter_animate.dart';

          class NeonBackground extends StatelessWidget {
            final Widget child;
            final Color primaryColor;
            final Color secondaryColor;

            const NeonBackground({
              super.key,
              required this.child,
              this.primaryColor = const Color(0xFFFF007F),
              this.secondaryColor = const Color(0xFF00E5FF),
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF070913),
                body: Stack(
                  children: [
                    Positioned(
                      top: -70,
                      left: -50,
                      child: AnimatedContainer(
                        duration: const Duration(seconds: 1),
                        width: 290,
                        height: 290,
                        decoration: BoxDecoration(shape: BoxShape.circle, color: primaryColor.withOpacity(0.85)),
                      )
                      .animate(onPlay: (c) => c.repeat(reverse: true))
                      .scale(begin: const Offset(1, 1), end: const Offset(1.3, 1.3), duration: 4.seconds)
                      .move(begin: const Offset(0, 0), end: const Offset(35, 35), duration: 5.seconds),
                    ),
                    Positioned(
                      bottom: -50,
                      right: -50,
                      child: AnimatedContainer(
                        duration: const Duration(seconds: 1),
                        width: 310,
                        height: 310,
                        decoration: BoxDecoration(shape: BoxShape.circle, color: secondaryColor.withOpacity(0.85)),
                      )
                      .animate(onPlay: (c) => c.repeat(reverse: true))
                      .scale(begin: const Offset(1.2, 1.2), end: const Offset(0.9, 0.9), duration: 6.seconds)
                      .move(begin: const Offset(0, 0), end: const Offset(-40, -40), duration: 4.seconds),
                    ),
                    child,
                  ],
                ),
              );
            }
          }
          """,

              "lib/ui/screens/onboarding_screen.dart": """import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_fonts/google_fonts.dart';
          import '../widgets/neon_background.dart';
          import '../widgets/glass_card.dart';
          import 'domain_selector_screen.dart';

          class OnboardingScreen extends StatefulWidget {
            const OnboardingScreen({super.key});

            @override
            State<OnboardingScreen> createState() => _OnboardingScreenState();
          }

          class _OnboardingScreenState extends State<OnboardingScreen> {
            final _nameCtrl = TextEditingController();
            final _ageCtrl = TextEditingController();
            String _level = 'Beginner (A1-A2)';

            @override
            Widget build(BuildContext context) {
              return NeonBackground(
                child: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 30),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        const SizedBox(height: 20),
                        Text(
                          "NEXUS LINGO",
                          textAlign: TextAlign.center,
                          style: GoogleFonts.orbitron(fontSize: 28, fontWeight: FontWeight.bold, letterSpacing: 4, color: const Color(0xFF00FFCC)),
                        ),
                        const SizedBox(height: 30),
                        GlassCard(
                          child: Column(
                            children: [
                              TextField(controller: _nameCtrl, style: const TextStyle(color: Colors.white), decoration: const InputDecoration(hintText: "Your Name", hintStyle: TextStyle(color: Colors.white38), border: InputBorder.none)),
                              const Divider(color: Colors.white24),
                              TextField(controller: _ageCtrl, keyboardType: TextInputType.number, style: const TextStyle(color: Colors.white), decoration: const InputDecoration(hintText: "Age", hintStyle: TextStyle(color: Colors.white38), border: InputBorder.none)),
                              const Divider(color: Colors.white24),
                              DropdownButton<String>(
                                value: _level,
                                isExpanded: true,
                                dropdownColor: const Color(0xFF131722),
                                underline: const SizedBox(),
                                style: const TextStyle(color: Colors.white),
                                items: ['Beginner (A1-A2)', 'Intermediate (B1-B2)', 'Advanced (C1-C2)'].map((l) => DropdownMenuItem(value: l, child: Text(l))).toList(),
                                onChanged: (v) => setState(() => _level = v!),
                              ),
                            ],
                          ),
                        ),
                        const SizedBox(height: 28),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFF00FFCC),
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                          ),
                          onPressed: () {
                            HapticFeedback.lightImpact();
                            Navigator.push(
                              context,
                              MaterialPageRoute(
                                builder: (ctx) => DomainSelectorScreen(
                                  userName: _nameCtrl.text.isEmpty ? 'Cadet' : _nameCtrl.text,
                                  level: _level,
                                  age: int.tryParse(_ageCtrl.text) ?? 20,
                                ),
                              ),
                            );
                          },
                          child: Text("LAUNCH UNIVERSE ➔", style: GoogleFonts.orbitron(color: Colors.black, fontWeight: FontWeight.bold)),
                        )
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          """,

              "lib/ui/screens/domain_selector_screen.dart": """import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_fonts/google_fonts.dart';
          import '../widgets/neon_background.dart';
          import '../widgets/glass_card.dart';
          import '../../services/ai_linguistic_engine.dart';
          import 'topic_learning_screen.dart';

          class DomainSelectorScreen extends StatelessWidget {
            final String userName;
            final String level;
            final int age;

            const DomainSelectorScreen({super.key, required this.userName, required this.level, required this.age});

            Color _getColor(String domain) {
              if (domain.contains('Gaming')) return const Color(0xFF00FF66);
              if (domain.contains('Computer')) return const Color(0xFF00E5FF);
              if (domain.contains('Electrical')) return const Color(0xFFFFD600);
              return const Color(0xFFFF9100);
            }

            @override
            Widget build(BuildContext context) {
              final domains = AiLinguisticEngine.getAllDomains();
              return NeonBackground(
                child: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.all(16),
                        child: Text("SELECT DOMAIN", style: GoogleFonts.orbitron(fontSize: 18, color: const Color(0xFF00FFCC), fontWeight: FontWeight.bold)),
                      ),
                      Expanded(
                        child: ListView.builder(
                          padding: const EdgeInsets.all(16),
                          itemCount: domains.length,
                          itemBuilder: (ctx, idx) {
                            final domain = domains[idx];
                            final color = _getColor(domain);
                            return Padding(
                              padding: const EdgeInsets.only(bottom: 12),
                              child: GlassCard(
                                neonBorderColor: color,
                                onTap: () {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                      builder: (ctx) => TopicLearningScreen(userName: userName, topic: domain, level: level, age: age),
                                    ),
                                  );
                                },
                                child: Text(domain, textAlign: TextAlign.center, style: GoogleFonts.orbitron(fontSize: 15, color: Colors.white, fontWeight: FontWeight.bold)),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          """,

              "lib/ui/screens/topic_learning_screen.dart": """import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_fonts/google_fonts.dart';
          import '../widgets/neon_background.dart';
          import '../widgets/glass_card.dart';
          import '../../services/ai_linguistic_engine.dart';
          import '../../services/self_contained_audio.dart';

          class TopicLearningScreen extends StatefulWidget {
            final String userName;
            final String topic;
            final String level;
            final int age;

            const TopicLearningScreen({super.key, required this.userName, required this.topic, required this.level, required this.age});

            @override
            State<TopicLearningScreen> createState() => _TopicLearningScreenState();
          }

          class _TopicLearningScreenState extends State<TopicLearningScreen> {
            late GeneratedLesson _lesson;
            int? _selected;
            bool _checked = false;
            int _xp = 0;
            int _streak = 0;

            @override
            void initState() {
              super.initState();
              SelfContainedAudio.init();
              _load();
            }

            void _load() {
              setState(() {
                _lesson = AiLinguisticEngine.generateDynamicLesson(widget.topic, widget.level, widget.age);
                _selected = null;
                _checked = false;
              });
              SelfContainedAudio.speak(_lesson.sentenceEn);
            }

            @override
            Widget build(BuildContext context) {
              return NeonBackground(
                child: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            IconButton(icon: const Icon(Icons.arrow_back_ios, color: Colors.white), onPressed: () => Navigator.pop(context)),
                            Text("🔥 $_streak  |  ⚡ $_xp XP", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                          ],
                        ),
                        const SizedBox(height: 8),
                        GlassCard(
                          child: Column(
                            children: [
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Text(_lesson.targetTerm, style: GoogleFonts.orbitron(fontSize: 20, color: Colors.white, fontWeight: FontWeight.bold)),
                                  IconButton(icon: const Icon(Icons.volume_up, color: Color(0xFF00FFCC)), onPressed: () => SelfContainedAudio.speak(_lesson.sentenceEn)),
                                ],
                              ),
                              Text("« ${_lesson.termDefinition} »", style: const TextStyle(color: Color(0xFF00FFCC))),
                              const Divider(color: Colors.white24, height: 16),
                              Text("“${_lesson.sentenceEn}”", textAlign: TextAlign.center, style: const TextStyle(color: Colors.white70)),
                              const SizedBox(height: 4),
                              Text(_lesson.sentenceFa, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white38)),
                            ],
                          ),
                        ),
                        const SizedBox(height: 12),
                        Expanded(
                          child: GlassCard(
                            child: Column(
                              children: [
                                Text(_lesson.quizQuestion, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                const SizedBox(height: 10),
                                ...List.generate(_lesson.quizOptions.length, (idx) {
                                  Color c = Colors.white10;
                                  if (_checked) {
                                    if (idx == _lesson.correctOptionIndex) c = Colors.green.withOpacity(0.5);
                                    else if (_selected == idx) c = Colors.red.withOpacity(0.5);
                                  } else if (_selected == idx) {
                                    c = const Color(0xFF00FFCC).withOpacity(0.35);
                                  }
                                  return Padding(
                                    padding: const EdgeInsets.only(bottom: 8),
                                    child: InkWell(
                                      onTap: _checked ? null : () {
                                        HapticFeedback.selectionClick();
                                        setState(() => _selected = idx);
                                      },
                                      child: Container(
                                        padding: const EdgeInsets.all(12),
                                        decoration: BoxDecoration(color: c, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white24)),
                                        child: Center(child: Text(_lesson.quizOptions[idx], style: const TextStyle(color: Colors.white))),
                                      ),
                                    ),
                                  );
                                }),
                                const Spacer(),
                                ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF7928CA)),
                                  onPressed: _selected == null ? null : () {
                                    if (!_checked) {
                                      final isCorrect = _selected == _lesson.correctOptionIndex;
                                      if (isCorrect) {
                                        HapticFeedback.mediumImpact();
                                        _xp += 30;
                                        _streak += 1;
                                      } else {
                                        HapticFeedback.vibrate();
                                        _streak = 0;
                                      }
                                      setState(() => _checked = true);
                                    } else {
                                      HapticFeedback.lightImpact();
                                      _load();
                                    }
                                  },
                                  child: Text(_checked ? "NEXT ➔" : "CHECK", style: const TextStyle(color: Colors.white)),
                                )
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          """
          }

          for path, content in files.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip())

          print("✅ تمام کدهای دارت و تنظیمات فلاتر با موفقیت ساخته شدند.")
          EOF

      # تولید خودکار پوشه استاندارد اندروید
      - name: Auto-Generate 100% Clean Android Engine
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.nexuslingo

      # تنظیم دسترسی‌های صدا در مانیفست اندروید
      - name: Configure Audio Permissions
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>
              <queries>
                  <intent><action android:name=\"android.intent.action.TTS_SERVICE\" /></intent>
              </queries>
          '''
          c = c.replace('<application', perms + '\n    <application')
          with open(p, 'w') as f: f.write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLingo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
